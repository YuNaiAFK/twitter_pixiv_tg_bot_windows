# Self-hosted Telegram Bot API server, via the aiogram image.
#
#   https://hub.docker.com/r/aiogram/telegram-bot-api
#
# This is what raises the bot's upload ceiling from 50 MB to 2000 MB and lets it send
# by local path, so an e-hentai original archive (~148 MB and up) can actually arrive.
#
# The environment variables below are the ones the image's own entrypoint translates
# into command-line arguments - they are not guesses. In particular TELEGRAM_LOCAL,
# when set to anything non-empty, is passed through as --local:
#
#     append_flag_from_env "TELEGRAM_LOCAL" "--local"
#
# --local is the flag that matters. Without it the server still enforces the public
# 50 MB limit and refuses local paths, so switching would gain nothing.
#
# Usage:
#   1. Put TELEGRAM_API_ID and TELEGRAM_API_HASH in .env (see .env.example).
#      These come from https://my.telegram.org -> API development tools, and are the
#      application's credentials - not the bot token.
#   2. docker compose up -d
#   3. Point the bot at it in .env:  TELEGRAM_API_BASE=http://127.0.0.1:8081
#                                    TELEGRAM_LOCAL=1
#   4. Restart the bot with run.bat.
#
# Verify with:  docker compose logs -f

services:
  telegram-bot-api:
    # Built locally from Dockerfile.bot-api-proxy, which wraps the upstream image and
    # adds transparent SOCKS5 redirection for TDLib's MTProto traffic. The upstream
    # image alone cannot reach Telegram on this network, and no amount of configuration
    # fixes that: TDLib ignores proxy environment variables and --proxy is webhook-only.
    build:
      context: .
      dockerfile: Dockerfile.bot-api-proxy
      # The base images are already local; asking the registry for metadata fails here
      # because Docker Hub is filtered too.
      pull: false
    image: telegram-bot-api-proxied:local
    container_name: telegram-bot-api
    restart: unless-stopped
    # iptables needs this, and only this, to install the redirect rules.
    cap_add:
      - NET_ADMIN
    # Host networking is not used: the port is published instead, so the bot on this
    # Windows host reaches the server at 127.0.0.1:8081 like any other local service.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
      # Any non-empty value becomes --local. This is the whole point of the switch.
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
      # The image defaults these; stated explicitly so the volume below matches.
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_VERBOSITY: "1"
      # Where the transparent redirection sends Telegram traffic. Read by
      # proxy-entrypoint.sh, which relays it with redsocks and NAT rules.
      #
      # `host.docker.internal` is how a container reaches the host on Docker Desktop;
      # 127.0.0.1 inside the container would be the container itself.
      #
      # Leave empty to connect directly - correct on a network that does not filter
      # Telegram, and the container will then start normally.
      #
      # Note this is deliberately NOT the server's own --proxy flag: that one is
      # webhook-only and cannot route the MTProto login.
      TELEGRAM_MT_PROXY: ${TELEGRAM_MT_PROXY:-}
    volumes:
      # A **named volume**, not a bind mount to a Windows directory.
      #
      # This is not a preference. With `./bot-api-data:/var/lib/telegram-bot-api` the
      # path is served through 9p (drvfs), and TDLib's binlog append-and-rename does not
      # survive it:
      #
      #   Failed to rename binlog of size 128 to .../td.binlog:
      #   [PosixError : No such file or directory : 2 : Stat for file ... failed]
      #   [pid 1] Signal: 6
      #
      # The server then crash-loops on every start and answers 502 to every request -
      # which looks exactly like bad credentials and is not. A named volume lives on the
      # Docker VM's own filesystem, where TDLib works normally.
      #
      # Inspect it with: docker volume inspect twitter_pixiv_tg_bot_windows_bot-api-data
      - bot-api-data:/var/lib/telegram-bot-api

volumes:
  bot-api-data:
